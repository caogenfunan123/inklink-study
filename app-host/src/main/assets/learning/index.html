<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>识字屋</title>
<script src="lib/hanzi-writer.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #121212; color: #eee;
    font-family: "Courier New", monospace;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  .hidden { display: none !important; }
  .topbar {
    width: 100%; padding: 10px 14px 6px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: #9e9e9e;
  }
  .topbar b { color: #ffd54f; }
  .stage { flex: 1; width: 100%; max-width: 560px; padding: 8px 16px 24px;
           display: flex; flex-direction: column; align-items: center; }
  /* ---------- 认读卡 ---------- */
  #introCard { width: 100%; text-align: center; }
  #charBox {
    width: 220px; height: 160px; margin: 6px auto;
    background: #1e1e1e; border: 3px solid #424242; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  #charFont {
    font-size: 96px; color: #ffd54f; font-weight: bold;
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #writerTarget { width: 140px; height: 140px; position: relative; z-index: 2; }
  #pinyin { font-size: 26px; color: #4fc3f7; margin-top: 4px; letter-spacing: 2px; }
  #phrase { font-size: 18px; color: #a5d6a7; margin-top: 10px; }
  #sentence { font-size: 15px; color: #bdbdbd; margin-top: 6px; line-height: 1.6; }
  .row { display: flex; gap: 12px; margin-top: 14px; justify-content: center; }
  button {
    font-family: inherit; border: none; border-radius: 14px; cursor: pointer;
    background: #2e2e2e; color: #eee; font-size: 16px; padding: 12px 22px;
    border-bottom: 4px solid #171717;
  }
  button:active { transform: translateY(2px); border-bottom-width: 2px; }
  button.primary { background: #43a047; border-bottom-color: #2b7030; font-size: 20px; padding: 14px 34px; color: #fff; }
  button.small { font-size: 14px; padding: 10px 14px; }
  /* ---------- 答题 ---------- */
  #quizCard { width: 100%; text-align: center; }
  #quizHint { font-size: 16px; color: #bdbdbd; margin-top: 8px; }
  #quizSpeaker {
    font-size: 64px; margin: 18px auto; width: 120px; height: 120px;
    background: #1e1e1e; border: 3px solid #4fc3f7; border-radius: 50%;
    line-height: 114px;
  }
  #options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .opt {
    background: #263238; border-bottom: 4px solid #10171a; border-radius: 16px;
    padding: 22px 0; font-size: 44px; color: #eee;
  }
  .opt.right { background: #2e7d32; }
  .opt.wrong { background: #b71c1c; }
  /* ---------- 结算 ---------- */
  #doneCard { width: 100%; text-align: center; margin-top: 30px; }
  #stars { font-size: 52px; margin: 20px 0; }
  #doneMsg { font-size: 20px; color: #ffd54f; margin-bottom: 8px; }
  #doneSub { font-size: 15px; color: #9e9e9e; margin-bottom: 26px; }
  #loading { margin-top: 40vh; font-size: 18px; color: #757575; }
</style>
</head>
<body>
<div class="topbar">
  <span id="hudLevel">识字屋</span>
  <span>进度 <b id="hudProgress">0/0</b> · ⭐ <b id="hudCorrect">0</b></span>
</div>

<div id="loading">加载中…</div>

<div id="introCard" class="stage hidden">
  <div id="charBox">
    <div id="charFont">一</div>
    <div id="writerTarget"></div>
  </div>
  <div id="pinyin">yī</div>
  <div id="phrase">词语:一天</div>
  <div id="sentence">一天一个苹果</div>
  <div class="row">
    <button class="small" id="btnSpeakChar">🔊 读一读</button>
    <button class="small" id="btnReplayStroke">✏️ 再看笔画</button>
  </div>
  <div class="row">
    <button class="primary" id="btnLearned">我学会了!</button>
  </div>
</div>

<div id="quizCard" class="stage hidden">
  <div id="quizHint">听一听,是哪个字?</div>
  <div id="quizSpeaker" onclick="quizSpeak()">🔊</div>
  <div id="options"></div>
</div>

<div id="doneCard" class="stage hidden">
  <div id="stars">⭐⭐⭐</div>
  <div id="doneMsg">太棒啦!</div>
  <div id="doneSub">小宠物因为你的努力升级啦</div>
  <div class="row">
    <button id="btnAgain">再来一关</button>
    <button id="btnHome">回宠物小屋</button>
  </div>
</div>

<script>
"use strict";
/* ===== 桥接层:window.InkBridge 由 LessonActivity 注入 ===== */
function bridge() { return window.InkBridge || null; }
function speak(text) { var b = bridge(); if (b) b.speak(String(text)); }
function sfx(name) { var b = bridge(); if (b) b.playSfx(String(name)); }
function haptic(ms) { var b = bridge(); if (b) b.haptic(Number(ms)); }

var LESSON = null;      // {module, level, items, pool}
var order = [];         // 本关顺序
var idx = 0;
var correct = 0;
var startTs = 0;
var writer = null;
var strokesData = null;

function el(id) { return document.getElementById(id); }
function show(id) { el(id).classList.remove("hidden"); }
function hide(id) { el(id).classList.add("hidden"); }

/* 原生回填课程数据 */
window.onLessonData = function (json) {
  LESSON = JSON.parse(json);
  el("hudLevel").textContent = "识字屋 · L" + LESSON.level;
  order = LESSON.items.slice();
  el("hudProgress").textContent = "0/" + order.length;
  el("hudCorrect").textContent = "0";
  hide("loading");
  startTs = Date.now();
  loadStrokes();
  nextChar();
};

/* 笔顺数据:整包 fetch 一次(离线 assets,失败则降级隐藏动画区) */
function loadStrokes() {
  if (strokesData) return;
  fetch("lib/strokes.json").then(function (r) { return r.json(); }).then(function (d) {
    strokesData = d;
  }).catch(function () { strokesData = null; });
}

function nextChar() {
  if (idx >= order.length) { finish(); return; }
  el("hudProgress").textContent = idx + "/" + order.length;
  var it = order[idx];
  el("charFont").textContent = it.char;
  el("pinyin").textContent = it.pinyin || "";
  el("phrase").textContent = it.phrase ? ("词语:" + it.phrase) : "";
  el("sentence").textContent = it.sentence || "";
  show("introCard"); hide("quizCard"); hide("doneCard");
  setupWriter(it.char);
  setTimeout(function () { speak(it.char); }, 400);
}

function setupWriter(ch) {
  var target = el("writerTarget");
  target.innerHTML = "";
  writer = null;
  el("charFont").style.opacity = "1";
  if (!window.HanziWriter || !strokesData || !strokesData[ch]) return;
  el("charFont").style.opacity = "0.25";
  writer = HanziWriter.create(target, ch, {
    width: 140, height: 140, padding: 8,
    strokeColor: "#ffd54f", outlineColor: "#555",
    delayBetweenStrokes: 260, strokeAnimationSpeed: 1.4,
    charDataLoader: function (c, onLoad) { onLoad(strokesData[c]); }
  });
  writer.loopCharacterAnimation();
}

function replayStroke() {
  if (writer) { writer.hideCharacter(); writer.showCharacter({ onComplete: function () { writer.loopCharacterAnimation(); } }); }
  else { var it = order[idx]; speak(it.char); }
}

/* ---------- 答题(听音选字) ---------- */
function startQuiz() {
  hide("introCard"); show("quizCard");
  var it = order[idx];
  var opts = [it.char];
  var pool = LESSON.pool.slice();
  while (opts.length < 4 && pool.length) {
    var p = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    if (opts.indexOf(p) < 0) opts.push(p);
  }
  shuffle(opts);
  var box = el("options");
  box.innerHTML = "";
  opts.forEach(function (ch) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = ch;
    b.onclick = function () { answer(b, ch); };
    box.appendChild(b);
  });
  setTimeout(quizSpeak, 350);
}

function quizSpeak() { if (LESSON && idx < order.length) speak(order[idx].char); }

function answer(btn, ch) {
  var it = order[idx];
  var ok = ch === it.char;
  btn.classList.add(ok ? "right" : "wrong");
  if (ok) {
    correct++; el("hudCorrect").textContent = String(correct);
    sfx("COIN");
    speak("答对啦,这是" + it.char);
    setTimeout(function () {
      idx++;
      nextChar();
    }, 900);
  } else {
    it.wrong = true;
    sfx("GROAN");
    haptic(200);
    btn.disabled = true;
    speak(it.char);
  }
}

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
}

/* ---------- 结算 ---------- */
function finish() {
  hide("introCard"); hide("quizCard"); show("doneCard");
  var total = order.length;
  var rate = total ? correct / total : 0;
  var stars = rate >= 0.9 ? 3 : (rate >= 0.6 ? 2 : 1);
  el("stars").textContent = stars >= 3 ? "⭐⭐⭐" : (stars === 2 ? "⭐⭐" : "⭐");
  el("doneMsg").textContent = rate >= 0.9 ? "太棒啦!" : "完成啦!";
  var dur = Math.round((Date.now() - startTs) / 1000);
  var wrong = [];
  // 结算由本地持久化;JS 只上报本关出现过的字与错误清单
  LESSON.items.forEach(function (it) { if (it.wrong) wrong.push(it.char); });
  sfx("LEVEL_UP");
  var b = bridge();
  if (b) {
    b.finishLesson(JSON.stringify({
      module: LESSON.module, level: LESSON.level,
      correct: correct, total: total, durationSec: dur,
      chars: LESSON.items.map(function (it) { return it.char; }),
      wrongChars: wrong
    }));
  }
}

el("btnLearned").onclick = startQuiz;
el("btnSpeakChar").onclick = function () { speak(order[idx].char); };
el("btnReplayStroke").onclick = replayStroke;
el("btnAgain").onclick = function () {
  idx = 0; correct = 0;
  el("hudCorrect").textContent = "0";
  shuffle(LESSON.items);
  order = LESSON.items.slice();
  nextChar();
};
el("btnHome").onclick = function () {
  var b = bridge(); if (b) b.closeLesson();
};

/* 错误可见化:原生侧异常直接显示,不再无限转圈 */
window.onLessonError = function (msg) {
  el("loading").textContent = "出错了:" + msg + "(点击屏幕重试)";
  el("loading").onclick = function () { location.reload(); };
};

/* 启动:主推送在原生 onPageFinished;800ms 兜底再拉一次 */
setTimeout(function () {
  if (!LESSON) {
    var b = bridge();
    if (b && b.getLessonData) b.getLessonData();
    else { el("loading").textContent = "桥接不可用(点击重试)"; el("loading").onclick = function () { location.reload(); }; }
  }
}, 800);
</script>
</body>
</html>
