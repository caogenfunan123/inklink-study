<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>拼音森林</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #121212; color: #eee; font-family: "Courier New", monospace;
         display: flex; flex-direction: column; align-items: center; user-select: none; overflow: hidden; }
  .hidden { display: none !important; }
  .topbar { width: 100%; padding: 10px 14px 6px; display: flex; justify-content: space-between;
            font-size: 14px; color: #9e9e9e; }
  .topbar b { color: #ffd54f; }
  .stage { flex: 1; width: 100%; max-width: 560px; padding: 8px 16px 24px;
           display: flex; flex-direction: column; align-items: center; }
  #loading { margin-top: 40vh; font-size: 18px; color: #757575; text-align: center; }
  .card { width: 100%; background: #1e1e1e; border: 3px solid #424242; border-radius: 18px;
          padding: 22px; text-align: center; }
  .big { font-size: 64px; color: #4fc3f7; font-weight: bold; }
  .tips { font-size: 15px; color: #bdbdbd; margin-top: 10px; line-height: 1.6; }
  .proxy { font-size: 17px; color: #a5d6a7; margin-top: 8px; }
  .row { display: flex; gap: 12px; margin-top: 16px; justify-content: center; }
  button { font-family: inherit; border: none; border-radius: 14px; cursor: pointer;
           background: #2e2e2e; color: #eee; font-size: 16px; padding: 12px 22px;
           border-bottom: 4px solid #171717; }
  button:active { transform: translateY(2px); }
  button.primary { background: #43a047; border-bottom-color: #2b7030; font-size: 20px; padding: 14px 34px; color: #fff; }
  .opt { background: #263238; border-bottom: 4px solid #10171a; border-radius: 16px;
         padding: 18px 0; font-size: 30px; color: #eee; width: 100%; }
  .opt.right { background: #2e7d32; }
  .opt.wrong { background: #b71c1c; }
  #options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; width: 100%; }
  .spell { font-size: 34px; color: #ffd54f; margin-top: 14px; }
  .spell .i { color: #4fc3f7; } .spell .f { color: #ef9a9a; } .spell .m { color: #a5d6a7; }
</style>
</head>
<body>
<div class="topbar"><span id="hudLevel">拼音森林</span><span>进度 <b id="hudProgress">0/0</b> · ⭐ <b id="hudCorrect">0</b></span></div>
<div id="loading">加载中…</div>

<div id="introCard" class="stage hidden">
  <div class="card">
    <div class="big" id="pinyinBig">b</div>
    <div class="tips" id="pinyinTips"></div>
    <div class="proxy" id="pinyinProxy"></div>
    <div class="spell hidden" id="spellLine"></div>
  </div>
  <div class="row"><button class="small" id="btnSpeak">🔊 读一读</button></div>
  <div class="row"><button class="primary" id="btnLearned">我学会了!</button></div>
</div>

<div id="quizCard" class="stage hidden">
  <div class="card">
    <div style="font-size:56px" id="quizChar">妈</div>
    <div style="font-size:40px" id="quizEmoji">👩</div>
    <div style="font-size:14px;color:#9e9e9e;margin-top:6px">它的拼音是哪个?</div>
  </div>
  <div id="options"></div>
</div>

<div id="doneCard" class="stage hidden">
  <div style="font-size:52px;margin-top:30px">⭐⭐⭐</div>
  <div style="font-size:20px;color:#ffd54f;margin:12px 0" id="doneMsg">太棒啦!</div>
  <div style="font-size:14px;color:#9e9e9e" id="doneSub">拼音小达人</div>
  <div class="row"><button id="btnAgain">再来一关</button><button id="btnHome">回拼音森林</button></div>
</div>

<script>
"use strict";
function bridge() { return window.InkBridge || null; }
function speak(t) { var b = bridge(); if (b) b.speak(String(t)); }
function sfx(n) { var b = bridge(); if (b) b.playSfx(String(n)); }
function haptic(ms) { var b = bridge(); if (b) b.haptic(Number(ms)); }
function el(id) { return document.getElementById(id); }
function show(id) { el(id).classList.remove("hidden"); }
function hide(id) { el(id).classList.add("hidden"); }

var LESSON = null, order = [], qIdx = 0, idx = 0, correct = 0, startTs = 0;
var wrong = [];

window.onLessonError = function (msg) {
  el("loading").textContent = "出错了:" + msg + "(点击重试)";
  el("loading").onclick = function () { location.reload(); };
};

window.onLessonData = function (json) {
  LESSON = JSON.parse(json);
  el("hudLevel").textContent = "拼音森林 · L" + LESSON.level;
  order = LESSON.letters.slice();
  qIdx = 0;
  el("hudProgress").textContent = "0/" + order.length;
  el("hudCorrect").textContent = "0";
  hide("loading"); hide("doneCard");
  startTs = Date.now();
  nextLetter();
};

function nextLetter() {
  if (idx >= order.length) { startQuiz(); return; }
  el("hudProgress").textContent = idx + "/" + order.length;
  var it = order[idx];
  el("pinyinBig").textContent = it.pinyin;
  el("pinyinTips").textContent = it.tips || "";
  el("pinyinProxy").textContent = it.proxyChar ? ("像读:" + it.proxyChar) : "";
  var sp = el("spellLine");
  if (it.initial && it.final) {
    sp.classList.remove("hidden");
    sp.innerHTML = '<span class="i">' + it.initial + '</span> + <span class="f">' + it.final + '</span> → ' + it.pinyin;
  } else { sp.classList.add("hidden"); }
  show("introCard"); hide("quizCard");
  setTimeout(function () {
    speak(it.proxyChar || it.pinyin);
  }, 400);
}

function startQuiz() {
  hide("introCard"); show("quizCard");
  askQuestion();
}

function askQuestion() {
  if (qIdx >= LESSON.questions.length) { finish(); return; }
  var q = LESSON.questions[qIdx];
  el("quizChar").textContent = q.char;
  el("quizEmoji").textContent = q.image || "❓";
  var ans = q.pinyin + toneMark(q.tone);
  var opts = [ans];
  var pool = LESSON.pool.slice();
  while (opts.length < 4 && pool.length) {
    var p = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    if (opts.indexOf(p) < 0) opts.push(p);
  }
  // 干扰项也带随机调号,防止孩子只认"有调号的那一个"
  opts = opts.map(function (o, i) {
    if (i === 0) return o;
    return markTone(o, 1 + Math.floor(Math.random() * 4));
  });
  shuffle(opts);
  var box = el("options");
  box.innerHTML = "";
  opts.forEach(function (o) {
    var b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = function () {
      if (b.dataset.done) return;
      b.dataset.done = 1;
      if (o === ans) {
        b.classList.add("right"); correct++;
        el("hudCorrect").textContent = String(correct);
        sfx("COIN"); speak(q.char);
        qIdx++;
        setTimeout(askQuestion, 900);
      } else {
        b.classList.add("wrong"); sfx("GROAN"); haptic(200);
        if (wrong.indexOf(q.pinyin) < 0) wrong.push(q.pinyin);
        speak(q.char);
      }
    };
    box.appendChild(b);
  });
}

var TONES = { 1: "\u0304", 2: "\u0301", 3: "\u030C", 4: "\u0300", 0: "" };
var VOWEL = "aoeiuvü";
function markTone(base, tone) {
  var m = TONES[tone] || "";
  if (!m) return base;
  for (var i = 0; i < base.length; i++) {
    if (VOWEL.indexOf(base[i]) >= 0) return base.slice(0, i) + base[i] + m + base.slice(i + 1);
  }
  return base + m;
}
function toneMark(tone) { return markTone(qIdxChar(), tone); }
function qIdxChar() { return LESSON.questions[Math.min(qIdx, LESSON.questions.length - 1)].pinyin; }

function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } }

function finish() {
  hide("introCard"); hide("quizCard"); show("doneCard");
  var total = order.length + LESSON.questions.length;
  var rate = total ? (correct + letterCorrect()) / total : 0;
  el("doneMsg").textContent = rate >= 0.8 ? "太棒啦!" : "完成啦!";
  var dur = Math.round((Date.now() - startTs) / 1000);
  var wrong = [];
  sfx("LEVEL_UP");
  var b = bridge();
  if (b) {
    b.finishLesson(JSON.stringify({
      module: LESSON.module, level: LESSON.level,
      correct: correct + letterCorrect(), total: total, durationSec: dur,
      chars: LESSON.letters.map(function (l) { return l.pinyin; })
        .concat(LESSON.questions.map(function (q) { return q.pinyin; })),
      wrongChars: wrong
    }));
  }
}
function letterCorrect() { return order.length; } // 字母卡全跟读记为掌握

el("btnLearned").onclick = function () { idx++; nextLetter(); };
el("btnSpeak").onclick = function () { var it = order[Math.min(idx, order.length - 1)]; speak(it.proxyChar || it.pinyin); };
el("btnAgain").onclick = function () { idx = 0; qIdx = 0; correct = 0; el("hudCorrect").textContent = "0"; window.onLessonData(JSON.stringify(LESSON)); };
el("btnHome").onclick = function () { var b = bridge(); if (b) b.closeLesson(); };

setTimeout(function () {
  if (!LESSON) {
    var b = bridge();
    if (b && b.getLessonData) b.getLessonData();
    else { el("loading").textContent = "桥接不可用(点击重试)"; el("loading").onclick = function () { location.reload(); }; }
  }
}, 800);
</script>
</body>
</html>
