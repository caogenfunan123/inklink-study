<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>古诗亭</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #121212; color: #eee; font-family: serif;
         display: flex; flex-direction: column; align-items: center; user-select: none; overflow: hidden; }
  .hidden { display: none !important; }
  .topbar { width: 100%; padding: 10px 14px 6px; display: flex; justify-content: space-between;
            font-size: 14px; color: #9e9e9e; }
  .topbar b { color: #ffd54f; }
  .stage { flex: 1; width: 100%; max-width: 560px; padding: 8px 16px 24px;
           display: flex; flex-direction: column; align-items: center; }
  #loading { margin-top: 40vh; font-size: 18px; color: #757575; text-align: center; }
  .card { width: 100%; background: #1c1a17; border: 3px solid #5d4037; border-radius: 18px;
          padding: 22px; text-align: center; }
  .title { font-size: 28px; color: #ffd54f; font-weight: bold; }
  .by { font-size: 14px; color: #bcaaa4; margin-top: 6px; }
  .lines { margin-top: 16px; }
  .line { font-size: 22px; color: #fff; line-height: 2.1; cursor: pointer; }
  .trans { font-size: 13px; color: #9e9e9e; margin-top: 12px; line-height: 1.8; }
  .row { display: flex; gap: 12px; margin-top: 16px; justify-content: center; }
  button { font-family: inherit; border: none; border-radius: 14px; background: #2e2e2e;
           color: #eee; font-size: 16px; padding: 12px 22px; border-bottom: 4px solid #171717; }
  button.primary { background: #8d6e63; border-bottom-color: #4e342e; font-size: 20px; color: #fff; padding: 14px 34px; }
  .opt { background: #33291f; border-bottom: 4px solid #1b1410; border-radius: 14px;
         padding: 14px 0; font-size: 24px; color: #fff; width: 100%; }
  .opt.right { background: #2e7d32; }
  .opt.wrong { background: #b71c1c; }
  #quizOptions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; width: 100%; }
  .blank { color: #ffd54f; text-decoration: underline; }
</style>
</head>
<body>
<div class="topbar"><span id="hudLevel">古诗亭</span><span>进度 <b id="hudProgress">0/0</b> · ⭐ <b id="hudCorrect">0</b></span></div>
<div id="loading">加载中…</div>

<div id="readCard" class="stage hidden">
  <div class="card">
    <div class="title" id="pTitle"></div>
    <div class="by" id="pBy"></div>
    <div class="lines" id="pLines"></div>
    <div class="trans" id="pTrans"></div>
  </div>
  <div class="row">
    <button id="btnRead">🔊 一起读</button>
    <button class="primary" id="btnRecite">我会背了 →</button>
  </div>
</div>

<div id="quizCard" class="stage hidden">
  <div class="card">
    <div style="font-size:14px;color:#bcaaa4">背一背:空缺处是哪个字?</div>
    <div class="lines" id="quizLine" style="margin-top:12px"></div>
  </div>
  <div id="quizOptions"></div>
</div>

<div id="doneCard" class="stage hidden">
  <div style="font-size:52px;margin-top:30px">🏮</div>
  <div style="font-size:20px;color:#ffd54f;margin:12px 0">古诗小诗人!</div>
  <div class="row"><button id="btnAgain">再来一轮</button><button id="btnHome">回古诗亭</button></div>
</div>

<script>
"use strict";
function bridge() { return window.InkBridge || null; }
function speak(t) { var b = bridge(); if (b) b.speak(String(t)); }
function sfx(n) { var b = bridge(); if (b) b.playSfx(String(n)); }
function haptic(ms) { var b = bridge(); if (b) b.haptic(Number(ms)); }
function el(id) { return document.getElementById(id); }
function show(id) { el(id).classList.remove("hidden"); }
function hide(id) { el(id).classList.add("hidden"); }

var LESSON = null, pIdx = 0, correct = 0, quizCount = 0, startTs = 0;
var wrong = [];
var quiz = null; // {lineIndex, blankIndex, answerChar}

window.onLessonError = function (msg) {
  el("loading").textContent = "出错了:" + msg + "(点击重试)";
  el("loading").onclick = function () { location.reload(); };
};

window.onLessonData = function (json) {
  LESSON = JSON.parse(json);
  el("hudLevel").textContent = "古诗亭 · L" + LESSON.level;
  el("hudProgress").textContent = "0/" + LESSON.poems.length;
  el("hudCorrect").textContent = "0";
  hide("loading"); hide("doneCard");
  startTs = Date.now();
  showPoem();
};

function showPoem() {
  if (pIdx >= LESSON.poems.length) { finish(); return; }
  quiz = null;
  el("hudProgress").textContent = pIdx + "/" + LESSON.poems.length;
  var p = LESSON.poems[pIdx];
  el("pTitle").textContent = "《" + p.title + "》";
  el("pBy").textContent = (p.dynasty || "") + " · " + (p.author || "");
  var box = el("pLines");
  box.innerHTML = "";
  p.lines.forEach(function (line, i) {
    var d = document.createElement("div");
    d.className = "line";
    d.textContent = line;
    d.onclick = function () { speak(line); };
    box.appendChild(d);
  });
  el("pTrans").textContent = p.trans || "";
  show("readCard"); hide("quizCard");
  setTimeout(function () { speak(p.title + "," + p.author + "。" + p.lines.join("。")); }, 400);
}

function startQuiz() {
  var p = LESSON.poems[pIdx];
  // 从正文里挑一个非标点单字挖空
  var lineIdx = Math.floor(Math.random() * p.lines.length);
  var line = p.lines[lineIdx];
  var chars = line.replace(/[，。!?!,]/g, "");
  var blankIdx = Math.floor(Math.random() * chars.length);
  var answer = chars[blankIdx];
  var shown = "";
  var ci = 0;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (/[，。!?!,]/.test(c)) { shown += c; continue; }
    shown += (ci === blankIdx) ? '<span class="blank">○</span>' : c;
    ci++;
  }
  quiz = { answer: answer, line: line };
  el("quizLine").innerHTML = shown + '<div style="font-size:13px;color:#9e9e9e;margin-top:8px">《' + p.title + '》</div>';
  hide("readCard"); show("quizCard");
  var opts = [answer];
  var pool = "春花秋月山水风雪云天日月大小高低远近来去不知白黄青绿红".split("");
  while (opts.length < 4 && pool.length) {
    var c2 = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    if (opts.indexOf(c2) < 0 && line.indexOf(c2) < 0) opts.push(c2);
  }
  shuffle(opts);
  var box = el("quizOptions");
  box.innerHTML = "";
  opts.forEach(function (o) {
    var b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = function () {
      if (b.dataset.done) return;
      b.dataset.done = 1;
      quizCount++;
      if (o === answer) {
        b.classList.add("right"); correct++;
        el("hudCorrect").textContent = String(correct);
        sfx("COIN"); speak(answer);
        pIdx++;
        setTimeout(function () { showPoem(); }, 1000);
      } else {
        b.classList.add("wrong"); sfx("GROAN"); haptic(200);
        var t = LESSON.poems[pIdx].title;
        if (wrong.indexOf(t) < 0) wrong.push(t);
        speak("是" + answer);
      }
    };
    box.appendChild(b);
  });
  speak("背一背,空缺处是哪个字?");
}

function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } }

function finish() {
  hide("readCard"); hide("quizCard"); show("doneCard");
  var total = quizCount || 1;
  var dur = Math.round((Date.now() - startTs) / 1000);
  sfx("LEVEL_UP");
  var b = bridge();
  if (b) {
    b.finishLesson(JSON.stringify({
      module: LESSON.module, level: LESSON.level,
      correct: correct, total: total, durationSec: dur,
      chars: LESSON.poems.map(function (p) { return p.title; }),
      wrongChars: wrong
    }));
  }
}

el("btnRead").onclick = function () {
  var p = LESSON.poems[pIdx];
  speak(p.title + "," + p.author + "。" + p.lines.join("。"));
};
el("btnRecite").onclick = startQuiz;
el("btnAgain").onclick = function () { pIdx = 0; correct = 0; quizCount = 0; el("hudCorrect").textContent = "0"; window.onLessonData(JSON.stringify(LESSON)); };
el("btnHome").onclick = function () { var b = bridge(); if (b) b.closeLesson(); };

setTimeout(function () {
  if (!LESSON) {
    var b = bridge();
    if (b && b.getLessonData) b.getLessonData();
    else { el("loading").textContent = "桥接不可用(点击重试)"; el("loading").onclick = function () { location.reload(); }; }
  }
}, 800);
</script>
</body>
</html>
