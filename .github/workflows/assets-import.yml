name: assets-import

# 手动触发：将 QQPet 上游素材（resources/，约 347MB / 8059 文件）导入
# third_party/qqpet/resources/，由本仓库 LFS 承载。
# 背景：开发沙盒出网上行限速 ~12KB/s，329MB LFS 推送 8 小时以上不可行；
# runner 网络正常，改由 CI 克隆上游后提交推送。可重复执行，无变更时自动跳过。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出本仓（跳过 LFS smudge）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: 安装 git-lfs
        run: |
          git lfs install
          git lfs version

      - name: 克隆 QQPet 上游并拉取 LFS 实体（固定 vendored commit）
        run: |
          git init /tmp/qqpet-upstream
          cd /tmp/qqpet-upstream
          git remote add origin https://github.com/AnkioTomas/qqpet.git
          git fetch --depth 1 origin db7cf74f8dd0770ead920177338ba05bb6c24ec6 \
            || git fetch --depth 1 origin
          git checkout FETCH_HEAD
          git lfs pull
          # 守卫：素材目录必须存在且文件数符合预期
          test -d resources/pet
          COUNT=$(find resources/pet -type f | wc -l)
          echo "上游 resources/pet 文件数: $COUNT"
          test "$COUNT" -gt 8000
          # 守卫：抽样确认是实体文件而非 LFS 指针文本
          SAMPLE=$(find resources/pet -type f | head -1)
          echo "抽样: $SAMPLE"
          if head -c 40 "$SAMPLE" | grep -q "git-lfs"; then
            echo "::error::抽样文件仍是 LFS 指针: $SAMPLE"
            exit 1
          fi

      - name: 拷入 third_party/qqpet/resources/
        run: |
          mkdir -p third_party/qqpet/resources
          cp -a /tmp/qqpet-upstream/resources/. third_party/qqpet/resources/
          du -sh third_party/qqpet/resources/
          find third_party/qqpet/resources -type f | wc -l

      - name: 提交并推送（LFS 对象随 push 自动上传）
        run: |
          git config user.name "HAN"
          git config user.email "me@hanyibo.com"
          git add third_party/qqpet/resources
          if git diff --cached --quiet; then
            echo "素材已入库且无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(vendor): 导入 QQPet 美术/SWF 素材（LFS，347MB）"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/caogenfunan123/inklink-study.git" HEAD:master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
