name: Android Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Restore qqpet LFS cache
      id: lfscache
      # 缓存 .git/lfs 避免每次跑满 LFS 月带宽配额；素材更新后手工升级 key 为 v2、v3……
      uses: actions/cache/restore@v4
      with:
        path: .git/lfs
        key: qqpet-lfs-v1
        restore-keys: qqpet-lfs-

    - name: Checkout
      uses: actions/checkout@v4
      env:
        # LFS 对象先走缓存+lfs pull，跳过 checkout 时 smudge
        GIT_LFS_SKIP_SMUDGE: '1'

    - name: Pull LFS assets
      run: git lfs pull

    - name: Guard LFS assets ready
      run: |
        # QQPet 游戏厅已合并进 app-host（assets.srcDirs 指向 third_party/qqpet/resources），
        # 素材缺失会产出残废 APK，必须硬失败而不是放过
        if [ ! -d third_party/qqpet/resources/pet ] || \
           grep -rl --include="*.swf" -m1 "^version https://git-lfs" third_party/qqpet/resources/pet >/dev/null 2>&1; then
          echo "::error::third_party/qqpet/resources/pet LFS 素材未就位，游戏厅构建中止（跑 assets-import 工作流入库）"
          exit 1
        fi

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: third_party/qqpet/package-lock.json

    - name: Build QQPet web assets
      # 游戏厅 vite 产物（index/game/swf.html + ruffle/）进 app-host assets；
      # 构建产物不入库，每次 CI 重新生成（与上游 build:android-web 同命令）
      working-directory: third_party/qqpet
      run: npm ci && npm run typecheck && npm run build:android-web

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Unit tests (JVM 契约与回归门禁)
      # 必须跑：此前三条衰减/玩法单测长期失效，正是因为 CI 只做 assembleRelease、
      # 从不执行单测（编译期不检查断言，失效无法被发现）。素材契约（附录A）同样依赖这里。
      # app-controller 单测（ControllerState/DeviceRepository/TrackStore/HistoryClient）同为回归门禁。
      # common 单测（协议往返/围栏/传输/音频帧/工具）也必须进门禁——
      # 2026-10 复盘发现 GeoFenceManagerTest 两个多围栏用例与实现语义相反却因不进 CI 而隐形。
      env:
        ORG_GRADLE_PROJECT_ABLY_KEY: ${{ secrets.ABLY_KEY }}
        ORG_GRADLE_PROJECT_TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
        ORG_GRADLE_PROJECT_TENCENT_MAP_SK: ${{ secrets.TENCENT_MAP_SK }}
      run: ./gradlew :common:testDebugUnitTest :app-host:testDebugUnitTest :app-controller:testDebugUnitTest --stacktrace

    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: |
          common/build/reports/tests/
          app-host/build/reports/tests/
          app-controller/build/reports/tests/
        if-no-files-found: ignore

    - name: Build APKs
      # app-host 现含 QQPet 游戏厅（vite 产物 + LFS 素材 ~347MB），APK 约 360MB
      env:
        ORG_GRADLE_PROJECT_ABLY_KEY: ${{ secrets.ABLY_KEY }}
        ORG_GRADLE_PROJECT_TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
        ORG_GRADLE_PROJECT_TENCENT_MAP_SK: ${{ secrets.TENCENT_MAP_SK }}
        INKLINK_STORE_PASSWORD: ${{ secrets.INKLINK_STORE_PASSWORD }}
        INKLINK_KEY_PASSWORD: ${{ secrets.INKLINK_KEY_PASSWORD }}
        INKLINK_KEY_ALIAS: ${{ secrets.INKLINK_KEY_ALIAS }}
      run: ./gradlew assembleRelease --stacktrace

    - name: Rename APKs
      run: |
        mkdir -p dist
        cp app-host/build/outputs/apk/release/*.apk dist/InkLink-Host-release.apk
        cp app-controller/build/outputs/apk/release/*.apk dist/InkLink-Controller-release.apk

    - name: Upload InkLink APKs
      uses: actions/upload-artifact@v4
      with:
        name: inklink-apks
        path: dist/*.apk
        if-no-files-found: error

    - name: Save qqpet LFS cache
      # 仅在 LFS 对象拉全后保存；key 已存在时 save 只告警不失败（幂等）
      if: steps.lfscache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .git/lfs
        key: qqpet-lfs-v1

  release:
    needs: [ build ]
    # 仅 tag push 或手动 dispatch 发版；普通 push 只跑单测门禁与构建，不再堆积 Release 资产
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
    - name: Download InkLink APKs
      uses: actions/download-artifact@v4
      with:
        name: inklink-apks
        path: dist

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.2.0-{0}', github.run_number) }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && format('InkLink {0}', github.ref_name) || format('InkLink Release v1.2.0-{0}', github.run_number) }}
        body: |
          InkLink 游戏化养成 V1.1 全量落地
          - 双时钟秒级数值引擎（前台全速/后台自动休眠：四维豁免+精力健康缓慢恢复，分属性余量）
          - Room 持久化（背包单行 JSON + 事件日志环形 500）+ 10s 节流写盘
          - 10 物种共骨架部件化像素渲染（程序化补间、像素房间场景、分段进度条、像素气泡）
          - AI 行为树（状态抱怨 + 性格加权自主行为 + 情绪台词气泡）
          - 随机事件 / 冒险日记 / 里程碑成就 / 每日目标
          - 三类远程礼物（道具/Buff/装饰）+ 零花钱、43 串门/逗弄子类型、赠礼 ACK
          - QQPet 游戏厅合并进 InkLink-Host（third_party/qqpet vendor，WebView+Ruffle；
            含腾讯 QQ 宠物素材，仅限个人学习，请勿分发）
        files: dist/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
